name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trayloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: trayloop/package-lock.json

      - name: Install dependencies
        working-directory: trayloop
        run: npm ci

      - name: Lint
        working-directory: trayloop
        run: npx turbo lint

      - name: Type check
        working-directory: trayloop
        run: npx turbo type-check

      - name: Build
        working-directory: trayloop
        run: npx turbo build

      - name: Test
        working-directory: trayloop
        run: npx turbo test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trayloop_test
          REDIS_URL: redis://localhost:6379
