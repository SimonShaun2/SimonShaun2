name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        working-directory: trayloop
        run: |
          docker build -f infrastructure/docker/Dockerfile.api -t ${{ steps.ecr.outputs.registry }}/trayloop-api:${{ github.sha }} .
          docker push ${{ steps.ecr.outputs.registry }}/trayloop-api:${{ github.sha }}

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster trayloop-${{ github.event.inputs.environment || 'staging' }} \
            --service trayloop-${{ github.event.inputs.environment || 'staging' }}-api \
            --force-new-deployment
